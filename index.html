<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weight Loss Quiz</title>
<meta name="description" content="Why can't you lose weight? Take the 2-minute quiz and find the weak side of your Weight Loss Triangle. Kenapa berat anda tak turun? Jawab kuiz 2 minit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16201b; --ink2:#4a5650; --bg:#faf7f2; --card:#ffffff; --line:#e7e1d7;
  --accent:#ff5a36; --accent-ink:#ffffff; --good:#1f9d6b; --mid:#e9a514; --bad:#e2412b;
  --dark:#12201a; --tint:#fff1ec;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.display{font-family:"Bricolage Grotesque",Inter,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:16px 28px;font:700 17px Inter,sans-serif;cursor:pointer;text-decoration:none;box-shadow:0 8px 24px -8px rgba(255,90,54,.6);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--ink)}
.eyebrow{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
section{padding:72px 0}
h2.display{font-size:clamp(30px,5vw,46px);margin:10px 0 16px}
.lead{font-size:18px;color:var(--ink2);max-width:640px}

/* language toggle */
.lang{display:inline-flex;border:1.5px solid currentColor;border-radius:999px;overflow:hidden;font:700 13px Inter,sans-serif}
.lang button{background:none;border:0;color:inherit;font:inherit;padding:6px 12px;cursor:pointer;opacity:.7}
.lang button.on{background:var(--accent);color:#fff;opacity:1}

/* hero */
.hero{background:var(--dark);color:#fff;padding:28px 0 64px;overflow:hidden}
.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:48px}
.nav-r{display:flex;align-items:center;gap:18px}
.brand{font:800 20px "Bricolage Grotesque",sans-serif}
.brand span{color:var(--accent)}
.nav a{color:#fff;font-weight:600;text-decoration:none;font-size:15px;opacity:.85}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(40px,7vw,72px);margin:14px 0 18px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:19px;color:#c9d3ce;max-width:520px;margin-bottom:28px}
.ticks{list-style:none;margin-top:22px;display:grid;gap:8px;color:#c9d3ce;font-size:15px}
.ticks li::before{content:"✓";color:var(--accent);font-weight:800;margin-right:10px}
.hero-photo{aspect-ratio:4/5;border-radius:24px;background:#22342b center/cover;position:relative;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;color:#8aa197;font-size:14px;padding:20px;border:2px dashed #3a5146;border-radius:24px;height:100%}

/* triangle explainer */
.tri-explain{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.pillar-cards{display:grid;gap:14px;margin-top:24px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.pc b{display:block;font-size:17px;margin-bottom:2px}
.pc span{color:var(--ink2);font-size:15px}

/* results */
.results{background:#fff}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px}
.gallery figure{border-radius:18px;overflow:hidden;background:var(--bg);aspect-ratio:4/5;border:1px solid var(--line)}
.gallery img{width:100%;height:100%;object-fit:cover}
.gallery .ph{border-color:var(--line);color:#9a958c;border-radius:18px}

/* about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba figure{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:3/4;background:#e9e3d8}
.ba img{width:100%;height:100%;object-fit:cover}
.ba figcaption{position:absolute;left:10px;bottom:10px;background:var(--ink);color:#fff;font:800 13px Inter,sans-serif;letter-spacing:.1em;padding:6px 10px;border-radius:8px}
.ba figcaption.after{background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.stat b{display:block;font:800 26px "Bricolage Grotesque",Inter,sans-serif;color:var(--accent);line-height:1.1}
.stat span{font-size:13px;color:var(--ink2)}
.story p{color:var(--ink2);font-size:17px;margin-bottom:14px}
.story p:first-child{color:var(--ink);font-size:19px;font-weight:600}
.story blockquote{border-left:4px solid var(--accent);padding:4px 0 4px 16px;margin:18px 0;font:800 22px "Bricolage Grotesque",Inter,sans-serif;color:var(--ink)}

/* faq */
details{border-bottom:1px solid var(--line);padding:18px 0}
summary{font-weight:700;font-size:17px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:22px;line-height:1}
details[open] summary::after{content:"−"}
details p{color:var(--ink2);margin-top:10px}

.final{background:var(--dark);color:#fff;text-align:center}
.final p{color:#c9d3ce;margin:0 auto 28px;max-width:520px;font-size:18px}
footer{background:var(--dark);color:#7f9188;text-align:center;font-size:13px;padding:0 20px 32px}
.social{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.social a{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font:600 15px Inter,sans-serif;border:1.5px solid #3a5146;border-radius:999px;padding:10px 18px}
.social a:hover{border-color:var(--accent);color:var(--accent)}

/* quiz overlay */
#app{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;display:none}
#app.open{display:block}
.app-top{position:sticky;top:0;background:var(--bg);z-index:2;padding:14px 20px 10px;max-width:640px;margin:0 auto}
.app-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.app-bar .lang{color:var(--ink2)}
.icon-btn{background:none;border:0;font:600 15px Inter,sans-serif;color:var(--ink2);cursor:pointer;padding:6px 0}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.stage{max-width:640px;margin:0 auto;padding:16px 20px 60px}
.qtag{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.1em}
.qtitle{font-size:clamp(24px,4.5vw,32px);margin:10px 0 24px}
.qtitle span{color:var(--accent)}
.opts{display:grid;gap:12px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px 20px;font:500 17px Inter,sans-serif;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--tint)}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.scale .opt{padding:16px 0;text-align:center;font-weight:700}
.scale-lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:8px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-weight:600;font-size:15px}
.field input{font:500 17px Inter,sans-serif;padding:15px 16px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--accent)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-bottom:8px}
.small{font-size:13px;color:var(--ink2)}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* result */
.r-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;margin-bottom:18px}
.r-card h3{font-size:20px;margin-bottom:10px}
.tri-wrap{max-width:360px;margin:6px auto 4px}
.bars{display:grid;gap:12px;margin-top:10px}
.bar-top{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-bottom:5px}
.bar{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;border-radius:10px;width:0;transition:width .8s ease}
.weak-box{background:var(--tint);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;margin-top:16px}
.roots{list-style:none;display:grid;gap:10px;margin-top:12px}
.roots li{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--bg)}
.roots li.locked span{filter:blur(5px);user-select:none}
.roots li i{font-style:normal;flex:none}
.tip{background:#eef8f3;border-left:4px solid var(--good);border-radius:10px;padding:14px 16px}
#cal{min-width:280px;height:700px;border-radius:16px;overflow:hidden;margin-top:10px}
.booked{text-align:center;padding:30px 10px}
.booked .big{font-size:52px}

@media (max-width:820px){
  .hero-grid,.tri-explain,.about{grid-template-columns:1fr}
  .hero-photo{max-width:380px;aspect-ratio:1}
  .gallery{grid-template-columns:repeat(2,1fr)}
  section{padding:56px 0}
}
@media (max-width:480px){
  .scale{grid-template-columns:repeat(5,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .r-card{padding:20px 16px}
  .btn{width:100%}
  .nav a{display:none}
}
</style>
</head>

// state
let step = 0, answers = {}, lead = {}, leadSent = false, calShown = false;
const TOTAL = QUESTIONS.length + 1; // + contact form

function send(type, extra){
  if(!CONFIG.sheetUrl) return;
  const body = JSON.stringify(Object.assign({ type, time:new Date().toISOString(), source:SRC, lang:LANG }, extra));
  fetch(CONFIG.sheetUrl, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body }).catch(()=>{});
}

function openQuiz(){
  step = 0; answers = {}; leadSent = false; calShown = false;
  $("app").classList.add("open"); document.body.style.overflow = "hidden"; render(); send("start", {});
}
function closeQuiz(){ $("app").classList.remove("open"); document.body.style.overflow = ""; }
document.querySelectorAll("[data-start]").forEach(b => b.onclick = openQuiz);
$("close").onclick = closeQuiz;
$("back").onclick = () => { if(step > 0 && step <= QUESTIONS.length){ step--; render(); } };

function setProgress(){
  $("prog").style.width = (Math.min(step, TOTAL) / TOTAL * 100) + "%";
  $("back").style.visibility = (step > 0 && step <= QUESTIONS.length) ? "visible" : "hidden";
}

function render(){
  setProgress();
  if(step < QUESTIONS.length) { $("app").scrollTop = 0; return renderQuestion(QUESTIONS[step]); }
  if(step === QUESTIONS.length) { $("app").scrollTop = 0; return renderContact(); }
  renderResult();
}

function optLabel(a){ return L(Array.isArray(a) ? a[0] : a); }

function renderQuestion(q){
  const tag = q.pillar ? `${PILLARS[q.pillar].emoji} ${pname(q.pillar)}` : L(TAGS[q.tag]);
  let html = `<div class="fade"><div class="qtag">${tag} · ${step+1}/${TOTAL}</div><h2 class="display qtitle">${L(q.q)}</h2>`;
  if(q.type === "scale"){
    html += `<div class="opts scale">` + Array.from({length:10},(_,i)=>`<button class="opt${answers[q.id]===i+1?" sel":""}" data-v="${i+1}">${i+1}</button>`).join("") +
            `</div><div class="scale-lbl"><span>${T().scaleLo}</span><span>${T().scaleHi}</span></div>`;
  } else {
    html += `<div class="opts">` + q.a.map((a,i)=>`<button class="opt${answers[q.id]===i?" sel":""}" data-v="${i}">${optLabel(a)}</button>`).join("") + `</div>`;
  }
  $("stage").innerHTML = html + `</div>`;
  $("stage").querySelectorAll(".opt").forEach(b => b.onclick = () => {
    answers[q.id] = +b.dataset.v; b.classList.add("sel");
    if(step === Math.floor(QUESTIONS.length/2)) send("halfway", {});
    setTimeout(() => { step++; render(); }, 180);
  });
}

  const t = T();
  $("stage").innerHTML = `<div class="fade">
    <div class="qtag">${t.cTag}</div>
    <h2 class="display qtitle">${t.cH}</h2>
    <p class="small" style="margin:-10px 0 20px">${t.cSub}</p>
    <div class="field"><label for="f-name">${t.cName}</label><input id="f-name" autocomplete="name"></div>
    <div class="field"><label for="f-wa">${t.cWa}</label><input id="f-wa" type="tel" inputmode="tel" placeholder="012-345 6789" autocomplete="tel"></div>
    <div class="field"><label for="f-email">${t.cEmail}</label><input id="f-email" type="email" autocomplete="email"></div>
    <div class="err" id="f-err"></div>
    <button class="btn" id="f-go" style="width:100%">${t.cGo}</button>
    <p class="small" style="margin-top:12px;text-align:center">${t.cPrivacy}</p>
  </div>`;
  ["name","wa","email"].forEach(k => $("f-"+k).value = lead[k] || "");
  $("f-go").onclick = () => {
    const name = $("f-name").value.trim(), wa = $("f-wa").value.replace(/[^\d+]/g,""), email = $("f-email").value.trim();
    if(name.length < 2) return $("f-err").textContent = T().eName;
    if(wa.replace(/\D/g,"").length < 9) return $("f-err").textContent = T().eWa;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return $("f-err").textContent = T().eEmail;
    lead = { name, wa, email };
    step++; render();
  };
}

function score(){
  const s = {}, m = {};
  QUESTIONS.filter(q => q.pillar).forEach(q => {
    s[q.pillar] = (s[q.pillar]||0) + q.a[answers[q.id]][1];
    m[q.pillar] = (m[q.pillar]||0) + 3;
  });
  const pct = {}; Object.keys(PILLARS).forEach(p => pct[p] = Math.round(s[p] / m[p] * 100));
  const weakest = Object.keys(pct).sort((a,b) => pct[a] - pct[b])[0];
  const overall = Math.round(Object.values(pct).reduce((a,b)=>a+b,0) / 3);
  return { pct, weakest, overall };
}
const colorFor = v => v >= 67 ? "#1f9d6b" : v >= 34 ? "#e9a514" : "#e2412b";

function qualifies(){
  // hot lead = wants to start within a month, commitment 7+, open to investing
  return answers.start <= 1 && answers.commit >= 7 && answers.invest <= 1;
}

// answers are always saved in English, so your Sheet and Calendly stay in one language
function answerEN(id){ const q = QUESTIONS.find(x => x.id === id); const v = answers[id]; if(q.type === "scale") return v + "/10"; const a = q.a[v]; return (Array.isArray(a) ? a[0] : a).en; }

function renderResult(){
  const { pct, weakest, overall } = score();
  const t = T(), hot = qualifies(), allStrong = pct[weakest] >= 67, P = pname(weakest);
  const first = lead.name.split(" ")[0];

  if(!leadSent){
    leadSent = true;
    const row = { name:lead.name, whatsapp:lead.wa, email:lead.email, weakest:PILLARS[weakest].name.en, overall,
      nutritionPct:pct.nutrition, exercisePct:pct.exercise, mindsetPct:pct.mindset, hot: hot ? "YES" : "no" };
    QUESTIONS.forEach(q => row[q.id] = answerEN(q.id));
    send("lead", row);
    $("app").scrollTop = 0;
  }
  const summary = `Quiz (${LANG.toUpperCase()}): goal ${answerEN("goal")} | weakest: ${PILLARS[weakest].name.en} | N ${pct.nutrition}% E ${pct.exercise}% M ${pct.mindset}% | start: ${answerEN("start")} | commitment ${answers.commit}/10 | invest: ${answerEN("invest")} | WhatsApp ${lead.wa}`;

  const rootsHTML = ROOTS[weakest].map((r,i) =>
    i === 0 ? `<li><i>🔎</i><span>${L(r)}</span></li>` : `<li class="locked"><i>🔒</i><span>${L(r)}</span></li>`).join("");

  const bookBlock = hot ? `
    <div class="r-card" id="book">
      <h3 class="display" style="font-size:26px">${t.bookH(first)}</h3>
      <p>${t.bookP}</p>
      <div id="cal"></div>
    </div>` : `
    <div class="r-card" id="book">
      <h3>${t.tipH}</h3>
      <div class="tip">${L(TIPS[weakest])}</div>
      <p style="margin:18px 0 14px">${t.softP}</p>
      <button class="btn" id="open-cal" style="width:100%">${t.bookBtn}</button>
      <div id="cal" style="display:none"></div>
    </div>`;

  const order = ["nutrition","exercise","mindset"];
  $("stage").innerHTML = `<div class="fade">
    <div class="qtag">${t.rTag}</div>
    <h2 class="display qtitle">${allStrong ? t.rStrong(first) : t.rWeak(first, P)}</h2>
    <div class="r-card">
      <div class="tri-wrap">${triSVG(order.map(p => `${pname(p).toUpperCase()} ${pct[p]}%`), order.map(p => colorFor(pct[p])), order.map(p => p === weakest ? 16 : 9), null, allStrong ? -1 : order.indexOf(weakest))}</div>
      <div class="bars">${order.map(p => `<div><div class="bar-top"><span>${PILLARS[p].emoji} ${pname(p)}</span><span>${pct[p]}%</span></div><div class="bar"><span style="background:${colorFor(pct[p])}" data-w="${pct[p]}"></span></div></div>`).join("")}</div>
      <div class="weak-box">${allStrong ? t.boxStrong : t.boxWeak(P.toLowerCase())}</div>
    </div>
    <div class="r-card">
      <h3>${allStrong ? t.rootsHStrong : t.rootsH(P.toLowerCase())}</h3>
      <p class="small">${t.rootsSub}</p>
      <ul class="roots">${rootsHTML}</ul>
    </div>
    ${bookBlock}
    <p class="small" style="text-align:center;margin-top:10px">${t.disclaimer}</p>
  </div>`;

  requestAnimationFrame(() => setTimeout(() => document.querySelectorAll(".bar span").forEach(b => b.style.width = b.dataset.w + "%"), 60));

  const showCal = () => {
    const el = $("cal"); el.style.display = "block"; calShown = true;
    const go = () => Calendly.initInlineWidget({
      url: CONFIG.calendly + "?hide_gdpr_banner=1&primary_color=ff5a36",
      parentElement: el,
      prefill: { name: lead.name, email: lead.email, customAnswers: { a1: summary } },
      utm: { utmSource: SRC, utmMedium: "quiz", utmContent: weakest }
    });
    if(window.Calendly) go(); else { const iv = setInterval(() => { if(window.Calendly){ clearInterval(iv); go(); } }, 200); }
  };
  if(hot || calShown) { if(!hot) $("open-cal").remove(); showCal(); }
  else $("open-cal").onclick = () => { $("open-cal").remove(); showCal(); send("book_click", { name:lead.name, whatsapp:lead.wa }); };
}

// Calendly tells us when a booking is made
window.addEventListener("message", e => {
  if(e.origin !== "https://calendly.com" || !e.data || e.data.event !== "calendly.event_scheduled") return;
  send("booked", { name:lead.name, whatsapp:lead.wa, email:lead.email });
  $("book").innerHTML = `<div class="booked"><div class="big">🎉</div><h3 class="display" style="font-size:28px;margin:8px 0">${T().bookedH(lead.name.split(" ")[0])}</h3><p>${T().bookedP}</p></div>`;
});

applyLang();
</script>
</body>
</html>
